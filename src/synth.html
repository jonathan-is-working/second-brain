<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain Syntheses</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1f23; --muted: #6b7280; --line: #e3e1dc;
    --accent: #7c3aed; --accent-soft: #ede9fe; --link: #5b21b6; --code: #f1efe9;
    --day: #0ea5e9; --week: #f59e0b; --month: #e11d48;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15161a; --panel: #1d1e24; --text: #e7e7ea; --muted: #9ca3af; --line: #2e3038;
      --accent: #a78bfa; --accent-soft: #2e2547; --link: #c4b5fd; --code: #26272e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brand { font-weight: 700; font-size: 17px; margin: 0 6px 4px; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .search { width: 100%; margin: 14px 0 6px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: inherit; font-size: 14px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 6px 6px;
    display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .item { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text); font: inherit;
    font-size: 14px; padding: 7px 10px; border-radius: 8px; cursor: pointer; line-height: 1.35; }
  .item:hover { background: var(--accent-soft); }
  .item.active { background: var(--accent); color: #fff; }
  .item .sub { display: block; font-size: 12px; opacity: .7; }
  main { padding: 40px clamp(16px, 5vw, 64px) 80px; }
  article { max-width: 760px; margin: 0 auto; }
  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  .badge { padding: 2px 9px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 600; }
  h1.title { font-size: clamp(24px, 4vw, 32px); line-height: 1.2; margin: 10px 0 18px; letter-spacing: -.01em; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 8px;
    font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--accent); }
  .content { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 4vw, 36px); }
  .content h2 { font-size: 19px; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .content h2:first-child { margin-top: 0; }
  .content h3 { font-size: 16px; margin: 20px 0 6px; color: var(--accent); }
  .content p { margin: 8px 0; }
  .content ul, .content ol { padding-left: 22px; margin: 8px 0; }
  .content li { margin: 5px 0; }
  .content a { color: var(--link); text-decoration: none; border-bottom: 1px dashed currentColor; }
  .content a:hover { border-bottom-style: solid; }
  .content strong { font-weight: 650; }
  .content code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .content blockquote { margin: 12px 0; padding: 6px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
  .content table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 12px 0; display: block; overflow-x: auto; }
  .content th, .content td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
  .empty { color: var(--muted); text-align: center; margin-top: 20vh; }
  .menu { display: none; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); display: none; }
    aside.open { display: block; }
    .menu { display: inline-block; margin-bottom: 14px; }
    main { padding-top: 18px; }
  }
  @media print { aside, .actions, .pager, .menu { display: none !important; } .app { display: block; } .content { border: 0; } }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand">🧠 Second Brain<small id="gen"></small></div>
    <input class="search" id="q" placeholder="Filtrer…" autocomplete="off">
    <nav id="nav"></nav>
  </aside>
  <main>
    <button class="btn menu" id="menu">☰ Synthèses</button>
    <article id="view"></article>
  </main>
</div>
<script>
"use strict";
const DATA = /*__DATA__*/null;
const FR = (DATA.lang || "en").toLowerCase().startsWith("fr");
const T = FR
  ? { day: "Jours", week: "Semaines", month: "Mois", d: "Jour", w: "Semaine", m: "Mois", obs: "Ouvrir dans Obsidian", copy: "Copier le Markdown",
      copied: "Copié ✓", print: "Imprimer / PDF", prev: "← Plus récent", next: "Plus ancien →", empty: "Aucune synthèse pour l'instant. Lance <code>sb synth</code>.",
      filter: "Filtrer…", gen: "Généré le ", menu: "☰ Synthèses" }
  : { day: "Days", week: "Weeks", month: "Months", d: "Day", w: "Week", m: "Month", obs: "Open in Obsidian", copy: "Copy Markdown",
      copied: "Copied ✓", print: "Print / PDF", prev: "← Newer", next: "Older →", empty: "No synthesis yet. Run <code>sb synth</code>.",
      filter: "Filter…", gen: "Generated ", menu: "☰ Syntheses" };
const COLORS = { day: "var(--day)", week: "var(--week)", month: "var(--month)" };
const entries = DATA.entries;
const byId = new Map(entries.map((e) => [e.id, e]));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

document.getElementById("gen").textContent = T.gen + DATA.generated;
document.getElementById("q").placeholder = T.filter;
document.getElementById("menu").textContent = T.menu;
document.documentElement.lang = FR ? "fr" : "en";

function nav(filter = "") {
  const f = filter.toLowerCase();
  let h = "";
  for (const p of ["day", "week", "month"]) {
    const list = entries.filter((e) => e.period === p && (!f || (e.title + " " + e.markdown).toLowerCase().includes(f)));
    if (!list.length) continue;
    h += `<div class="group"><h3><span class="dot" style="background:${COLORS[p]}"></span>${T[p]} (${list.length})</h3>`;
    for (const e of list) {
      const short = e.title.split(" - ")[1] || e.title;
      h += `<button class="item" data-id="${esc(e.id)}">${esc(short)}<span class="sub">${esc(e.start)}${e.end !== e.start ? " → " + esc(e.end) : ""}</span></button>`;
    }
    h += `</div>`;
  }
  const navEl = document.getElementById("nav");
  navEl.innerHTML = h;
  navEl.querySelectorAll(".item").forEach((b) => b.addEventListener("click", () => show(b.dataset.id)));
  markActive();
}

let current = null;
function markActive() {
  document.querySelectorAll(".item").forEach((b) => b.classList.toggle("active", b.dataset.id === current));
}

function show(id) {
  const e = byId.get(id);
  const view = document.getElementById("view");
  if (!e) { view.innerHTML = `<p class="empty">${T.empty}</p>`; return; }
  current = id;
  history.replaceState(null, "", "#" + id);
  const same = entries.filter((x) => x.period === e.period);
  const i = same.indexOf(e);
  const label = { day: T.d, week: T.w, month: T.m }[e.period];
  view.innerHTML = `
    <div class="meta"><span class="badge" style="background:${COLORS[e.period]}">${label}</span>
      <span>${esc(e.start)}${e.end !== e.start ? " → " + esc(e.end) : ""}</span></div>
    <h1 class="title">${esc(e.title)}</h1>
    <div class="actions">
      <a class="btn" href="obsidian://open?path=${encodeURIComponent(e.file)}">${T.obs}</a>
      <button class="btn" id="copy">${T.copy}</button>
      <button class="btn" onclick="print()">${T.print}</button>
    </div>
    <div class="content">${e.html}</div>
    <div class="pager">
      <span>${i > 0 ? `<button class="btn" data-go="${esc(same[i - 1].id)}">${T.prev}</button>` : ""}</span>
      <span>${i < same.length - 1 ? `<button class="btn" data-go="${esc(same[i + 1].id)}">${T.next}</button>` : ""}</span>
    </div>`;
  view.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => show(b.dataset.go)));
  document.getElementById("copy").addEventListener("click", async (ev) => {
    try { await navigator.clipboard.writeText(e.markdown); ev.target.textContent = T.copied; } catch (_) {}
  });
  markActive();
  document.getElementById("side").classList.remove("open");
  scrollTo({ top: 0 });
}

document.getElementById("q").addEventListener("input", (ev) => nav(ev.target.value));
document.getElementById("menu").addEventListener("click", () => document.getElementById("side").classList.toggle("open"));
addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT" || !current) return;
  const e = byId.get(current), same = entries.filter((x) => x.period === e.period), i = same.indexOf(e);
  if ((ev.key === "ArrowLeft" || ev.key === "k") && i > 0) show(same[i - 1].id);
  if ((ev.key === "ArrowRight" || ev.key === "j") && i < same.length - 1) show(same[i + 1].id);
});

nav();
const fromHash = decodeURIComponent(location.hash.slice(1));
show(byId.has(fromHash) ? fromHash : (DATA.selected && byId.has(DATA.selected) ? DATA.selected : entries[0]?.id));
</script>
</body>
</html>
