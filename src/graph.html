<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain Graph</title>
<style>
  :root {
    --bg: #f4f3f0; --panel: #fbfaf8; --text: #2a2b2e; --label: #4a4c52; --muted: #7c7e84; --line: #e2e0db;
    --edge: 120, 124, 132; --chip: #ecebe6; --accent: #6f6799; --conn: 125, 112, 160; --side: 232px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18191c; --panel: #1f2024; --text: #dcdcdf; --label: #b9babf; --muted: #8a8c92; --line: #303137;
      --edge: 150, 154, 162; --chip: #292a2f; --accent: #a69fcc; --conn: 160, 148, 200; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  canvas { position: fixed; top: 0; left: var(--side); width: calc(100vw - var(--side)); height: 100vh;
    display: block; cursor: grab; touch-action: none; }
  body.collapsed canvas { left: 0; width: 100vw; }
  canvas.dragging { cursor: grabbing; }

  /* left sidebar */
  #side { position: fixed; top: 0; left: 0; bottom: 0; width: var(--side); background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 3; }
  body.collapsed #side { display: none; }
  .head { padding: 16px 16px 10px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .brand { font-weight: 650; font-size: 15px; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .icon { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 4px; border-radius: 6px; }
  .icon:hover { color: var(--text); background: var(--chip); }
  .scroll { overflow: auto; padding: 0 10px 12px; flex: 1; }
  .searchbtn { width: 100%; display: flex; justify-content: space-between; align-items: center; margin: 2px 0 6px;
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--muted);
    font: inherit; font-size: 13px; cursor: pointer; }
  .searchbtn:hover { border-color: var(--accent); }
  h4 { margin: 16px 6px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .kind { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; border: 0; border-radius: 7px;
    background: none; color: var(--text); font: inherit; font-size: 13.5px; cursor: pointer; text-align: left; }
  .kind:hover { background: var(--chip); }
  .kind .n { margin-left: auto; color: var(--muted); font-size: 12px; }
  .kind.off { color: var(--muted); }
  .kind.off .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  details { margin-top: 6px; }
  summary { list-style: none; cursor: pointer; margin: 14px 6px 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "▸"; } details[open] summary::after { content: "▾"; }
  .sub { margin: 10px 6px 5px; font-size: 12px; color: var(--muted); }
  .seg { display: flex; background: var(--chip); border-radius: 8px; padding: 3px; gap: 2px; margin: 0 4px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--text); font: inherit; font-size: 12px;
    padding: 4px 2px; border-radius: 6px; cursor: pointer; }
  .seg button.on { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 6px; font-size: 13px; cursor: pointer; }
  .row input[type=range] { width: 100px; accent-color: var(--accent); }
  .row input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
  .swatch { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 6px; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 9px; border-radius: 7px;
    font: inherit; font-size: 12px; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--accent); }
  .foot { padding: 10px 16px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; line-height: 1.6; }
  kbd { font: 10.5px ui-monospace, monospace; background: var(--chip); border-radius: 4px; padding: 1px 5px; }
  #expand { position: fixed; top: 12px; left: 12px; z-index: 3; display: none; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--text); cursor: pointer; font: inherit; }
  body.collapsed #expand { display: block; }

  /* centered search palette */
  #palette { position: fixed; inset: 0; display: none; z-index: 5; background: rgba(0,0,0,.18); }
  #palette.open { display: block; }
  #pbox { position: absolute; top: 22vh; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.2); overflow: hidden; }
  #pinput { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text);
    font: inherit; font-size: 17px; padding: 14px 16px; outline: none; }
  #presults { max-height: 320px; overflow: auto; }
  .res { display: flex; align-items: center; gap: 10px; padding: 9px 16px; cursor: pointer; font-size: 14px; }
  .res .k { margin-left: auto; color: var(--muted); font-size: 12px; }
  .res.on, .res:hover { background: var(--chip); }
  .none { padding: 12px 16px; color: var(--muted); font-size: 13px; }

  /* right detail panel */
  #panel { position: fixed; top: 12px; right: 12px; bottom: 12px; width: 360px; max-width: calc(100vw - 24px);
    overflow: auto; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,.08); transform: translateX(110%); transition: transform .2s ease; z-index: 4; }
  #panel.open { transform: none; }
  #panel h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.25; }
  #panel .pk { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
  #panel .summary { margin: 10px 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--chip); border-radius: 4px; }
  #panel .actions { display: flex; gap: 6px; margin: 10px 0 14px; flex-wrap: wrap; }
  #panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
  #panel ul { list-style: none; padding: 0; margin: 0; }
  #panel li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  #panel li:last-child { border-bottom: 0; }
  #panel ol.sub { margin: 6px 0 4px; padding-left: 22px; }
  #panel ol.sub li { padding: 2px 0; border: 0; line-height: 1.4; }
  #panel .meta { color: var(--muted); font-size: 12px; }
  #panel .nb { cursor: pointer; display: flex; align-items: flex-start; gap: 8px; }
  #panel .nb .dot { margin-top: 6px; }
  #panel .nb:hover { color: var(--accent); }
  #close { position: absolute; top: 10px; right: 10px; border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
  #empty { position: fixed; inset: 0; left: var(--side); display: none; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  @media (max-width: 700px) {
    :root { --side: 0px; }
    #side { width: 240px; box-shadow: 0 0 30px rgba(0,0,0,.2); }
    body:not(.mobile-open) #side { display: none; }
    #expand { display: block; }
    #panel { top: auto; height: 55vh; left: 12px; width: auto; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<aside id="side">
  <div class="head">
    <div class="brand">🧠 Second Brain<small id="stats"></small></div>
    <button class="icon" id="collapse" title="">⟨</button>
  </div>
  <div class="scroll">
    <button class="searchbtn" id="openSearch"><span id="searchLabel"></span><kbd>↵</kbd></button>
    <h4 id="typesTitle"></h4>
    <div id="types"></div>
    <details id="settingsBox"><summary id="settingsTitle"></summary><div id="settings"></div></details>
  </div>
  <div class="foot" id="hint"></div>
</aside>
<button id="expand">☰</button>
<div id="palette"><div id="pbox"><input id="pinput" autocomplete="off" spellcheck="false"><div id="presults"></div></div></div>
<aside id="panel"><button id="close">×</button><div id="detail"></div></aside>
<div id="empty"><div><h2 id="emptyTitle"></h2><p id="emptyText"></p></div></div>
<script>
"use strict";
const DATA = /*__DATA__*/null;
const FR = (DATA.lang || "en").toLowerCase().startsWith("fr");
document.documentElement.lang = FR ? "fr" : "en";
const T = FR ? {
  search: "Rechercher", searchPh: "Rechercher un nœud…", noResult: "Aucun résultat", types: "Afficher", display: "Réglages",
  nodes: "nœuds", links: "liens", labels: "Titres", lAuto: "Auto", lAll: "Tous", lHubs: "Principaux", lNone: "Aucun",
  linkTypes: "Liens", tree: "Hiérarchie", conn: "Connexions", weak: "Même source",
  view: "Vue", nodeSize: "Nœuds", textSize: "Texte", orphans: "Masquer isolés", local: "Vue locale (clic sur un nœud)", off: "Non",
  freeze: "⏸ Figer", resume: "▶ Reprendre", fit: "⤢ Recentrer", reset: "↺ Défaut", collapse: "Masquer le panneau",
  hint: "<kbd>↵</kbd> rechercher &nbsp; <kbd>L</kbd> titres<br><kbd>F</kbd> recentrer &nbsp; <kbd>Espace</kbd> figer<br><kbd>[</kbd> panneau &nbsp; <kbd>Échap</kbd> fermer",
  elems: "éléments", knows: "Ce que le cerveau sait", connected: "Connecté", obs: "Ouvrir dans Obsidian", file: "Ouvrir le fichier", due: "échéance",
  emptyT: "Ton graphe est vide", emptyP: "Écris dans ton journal, lance <code>sb ingest</code>, puis <code>sb graph</code>.",
} : {
  search: "Search", searchPh: "Search a node…", noResult: "No result", types: "Show", display: "Settings",
  nodes: "nodes", links: "links", labels: "Labels", lAuto: "Auto", lAll: "All", lHubs: "Main", lNone: "None",
  linkTypes: "Links", tree: "Hierarchy", conn: "Connections", weak: "Same source",
  view: "View", nodeSize: "Nodes", textSize: "Text", orphans: "Hide isolated", local: "Local view (click a node)", off: "Off",
  freeze: "⏸ Freeze", resume: "▶ Resume", fit: "⤢ Fit", reset: "↺ Defaults", collapse: "Hide panel",
  hint: "<kbd>↵</kbd> search &nbsp; <kbd>L</kbd> labels<br><kbd>F</kbd> fit &nbsp; <kbd>Space</kbd> freeze<br><kbd>[</kbd> panel &nbsp; <kbd>Esc</kbd> close",
  elems: "items", knows: "What the brain knows", connected: "Connected", obs: "Open in Obsidian", file: "Open file", due: "due",
  emptyT: "Your graph is empty", emptyP: "Write in your journal, run <code>sb ingest</code>, then <code>sb graph</code>.",
};
// Muted, low-saturation palette: hubs share a hue family, distinct but calm.
const KINDS = {
  area:     { fr: "Grands thèmes", en: "Grand themes", color: "#9b6470", base: 13 },
  theme:    { fr: "Thèmes",        en: "Themes",       color: "#c2a0a6", base: 8 },
  project:  { fr: "Projets",       en: "Projects",     color: "#b99a62", base: 9 },
  goal:     { fr: "Objectifs",     en: "Goals",        color: "#7f9a7a", base: 8 },
  concept:  { fr: "Concepts",      en: "Concepts",     color: "#6886a3", base: 6 },
  idea:     { fr: "Idées",         en: "Ideas",        color: "#8c80ab", base: 6 },
  deadline: { fr: "Échéances",     en: "Deadlines",    color: "#b07a66", base: 5 },
  task:     { fr: "Tâches",        en: "Tasks",        color: "#6a9a95", base: 4 },
  resource: { fr: "À explorer",    en: "To explore",   color: "#9aa77a", base: 3 },
  journal:  { fr: "Journaux",      en: "Journals",     color: "#999ca1", base: 4 },
};
const kindLabel = (k) => (KINDS[k] ? (FR ? KINDS[k].fr : KINDS[k].en) : k);
const ICON = { resource: "🔗", knowledge: "💡", episodic: "📝", decision: "✅", idea: "✨", goal: "🎯", profile: "👤", task: "☐", deadline: "📅" };
const TREE = new Set(["part_of", "in_theme", "in_area", "about", "task_of"]);
const WEAK = new Set(["source", "co"]);
const edgeType = (e) => (TREE.has(e.rel) ? "tree" : WEAK.has(e.rel) ? "weak" : "conn");

// --- settings (remembered per browser) -----------------------------------
const KEY = "sb-graph-v2";
const DEFAULTS = { labels: "hubs", tree: true, conn: true, weak: false, nodeScale: 1, textScale: 1, orphans: false, depth: 0, frozen: false, collapsed: false, hidden: null };
let S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (_) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ ...S, hidden: [...hidden] })); } catch (_) {} };

const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const nodes = DATA.nodes.map((n) => ({ ...n, x: 0, y: 0, vx: 0, vy: 0, deg: 0, vdeg: 0, nb: new Set() }));
const byId = new Map(nodes.map((n) => [n.id, n]));
const edges = DATA.edges.map((e) => ({ s: byId.get(e.s), t: byId.get(e.t), rel: e.rel, why: e.why })).filter((e) => e.s && e.t);
const whyOf = new Map();
for (const e of edges) {
  e.type = edgeType(e);
  e.s.deg++; e.t.deg++; e.s.nb.add(e.t); e.t.nb.add(e.s);
  if (e.why) { whyOf.set(e.s.id + "|" + e.t.id, e.why); whyOf.set(e.t.id + "|" + e.s.id, e.why); }
}
for (const n of nodes) n.r0 = (KINDS[n.kind]?.base ?? 5) + Math.sqrt(n.deg) * 2.4;

let seed = 42;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
nodes.forEach((n) => { const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * Math.sqrt(nodes.length) * 40; n.x = Math.cos(a) * d; n.y = Math.sin(a) * d; });

// Clean by default: when a theme tree exists, journals and "to explore" items start hidden.
const defaultHidden = () => (nodes.some((n) => n.kind === "area") ? ["journal", "resource"] : []);
const hidden = new Set(Array.isArray(S.hidden) ? S.hidden : defaultHidden());
let view = { x: 0, y: 0, k: 1 }, W = 0, H = 0, dpr = 1;
let hover = null, selected = null, query = "", alpha = 1, dragNode = null, panning = null, moved = false;
let local = null;

const edgeOn = (e) => S[e.type];
function recomputeDegrees() {
  for (const n of nodes) n.vdeg = 0;
  for (const e of edges) if (edgeOn(e) && !hidden.has(e.s.kind) && !hidden.has(e.t.kind)) { e.s.vdeg++; e.t.vdeg++; }
}
const visible = (n) => !hidden.has(n.kind) && (!S.orphans || n.vdeg > 0 || n === selected) && (!local || local.has(n.id));
const R = (n) => n.r0 * S.nodeScale;

function computeLocal() {
  if (!selected || !S.depth) { local = null; return; }
  local = new Set([selected.id]);
  let frontier = [selected];
  for (let d = 0; d < S.depth; d++) {
    const next = [];
    for (const n of frontier) for (const e of edges) {
      if (!edgeOn(e)) continue;
      const o = e.s === n ? e.t : e.t === n ? e.s : null;
      if (o && !local.has(o.id) && !hidden.has(o.kind)) { local.add(o.id); next.push(o); }
    }
    frontier = next;
  }
}

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function resize() {
  dpr = window.devicePixelRatio || 1; W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; draw();
}

// --- physics -------------------------------------------------------------
function tick() {
  const vis = nodes.filter(visible), n = vis.length;
  for (let i = 0; i < n; i++) {
    const a = vis[i];
    for (let j = i + 1; j < n; j++) {
      const b = vis[j];
      let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
      if (d2 > 640000) continue;
      if (d2 < 1) { dx = rnd() - 0.5; dy = rnd() - 0.5; d2 = 1; }
      const f = (2600 * S.nodeScale * alpha) / d2, d = Math.sqrt(d2);
      const fx = (dx / d) * f, fy = (dy / d) * f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
  }
  for (const e of edges) {
    if (!edgeOn(e) || !visible(e.s) || !visible(e.t)) continue;
    const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    const rest = (e.type === "weak" ? 110 : e.type === "tree" ? 35 : 90) + R(e.s) + R(e.t);
    const f = (d - rest) * (e.type === "weak" ? 0.012 : e.type === "tree" ? 0.08 : 0.02) * alpha;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    e.s.vx += fx; e.s.vy += fy; e.t.vx -= fx; e.t.vy -= fy;
  }
  for (const a of vis) {
    a.vx -= a.x * 0.004 * alpha; a.vy -= a.y * 0.004 * alpha;
    if (a === dragNode) { a.vx = a.vy = 0; continue; }
    a.vx *= 0.6; a.vy *= 0.6; a.x += a.vx; a.y += a.vy;
  }
  alpha = Math.max(alpha * 0.985, dragNode ? 0.3 : 0);
}
let looping = false;
function heat(a = 0.6) {
  if (S.frozen && !dragNode) { draw(); return; }
  alpha = Math.max(alpha, a);
  if (!looping) { looping = true; requestAnimationFrame(loop); }
}
function loop() {
  if (!S.frozen || dragNode) tick();
  draw();
  if ((alpha > 0.01 && !S.frozen) || dragNode) requestAnimationFrame(loop); else looping = false;
}

// --- rendering -----------------------------------------------------------
const toScreen = (x, y) => [(x - view.x) * view.k + W / 2, (y - view.y) * view.k + H / 2];
const toWorld = (sx, sy) => [(sx - W / 2) / view.k + view.x, (sy - H / 2) / view.k + view.y];
const matches = (n) => query && n.label.toLowerCase().includes(query);
const MAIN = new Set(["area", "project", "goal"]);

function wantsLabel(n, focus) {
  if (n === focus || matches(n)) return true;
  if (focus && focus.nb.has(n) && S.labels !== "none") return true;
  switch (S.labels) {
    case "none": return false;
    case "all": return true;
    case "hubs": return MAIN.has(n.kind);
    default: {
      const small = n.kind === "task" || n.kind === "deadline" || n.kind === "resource";
      return MAIN.has(n.kind) || n.kind === "theme" || (!small && view.k * R(n) > 6) || (small && view.k > 1.6);
    }
  }
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = css("--bg"); ctx.fillRect(0, 0, W, H);
  const focus = selected || hover, edgeRgb = css("--edge"), connRgb = css("--conn");
  const text = css("--text"), label = css("--label"), accent = css("--accent");
  const lit = (n) => !focus || n === focus || focus.nb.has(n);
  ctx.lineCap = "round";
  for (const e of edges) {
    if (!edgeOn(e) || !visible(e.s) || !visible(e.t)) continue;
    const on = focus && (e.s === focus || e.t === focus);
    const [x1, y1] = toScreen(e.s.x, e.s.y), [x2, y2] = toScreen(e.t.x, e.t.y);
    const rgb = e.type === "conn" ? connRgb : edgeRgb;
    const a = on ? 0.8 : focus ? 0.05 : e.type === "conn" ? 0.38 : e.type === "tree" ? 0.22 : 0.14;
    ctx.strokeStyle = `rgba(${rgb}, ${a})`;
    ctx.lineWidth = (on ? 1.6 : 1) * Math.min(1.5, Math.max(0.6, view.k));
    ctx.setLineDash(e.type === "weak" ? [3, 4] : []);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  ctx.setLineDash([]);
  const fs = Math.max(10.5, Math.min(14, 10 + view.k * 1.8)) * S.textScale;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (const n of nodes) {
    if (!visible(n)) continue;
    const [x, y] = toScreen(n.x, n.y), r = R(n) * Math.max(0.5, Math.min(view.k, 2.2));
    if (x < -60 || y < -60 || x > W + 60 || y > H + 60) continue;
    ctx.globalAlpha = lit(n) ? 1 : 0.16;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = KINDS[n.kind]?.color ?? "#999"; ctx.fill();
    if (n === selected || matches(n)) { ctx.lineWidth = 2; ctx.strokeStyle = accent; ctx.stroke(); }
    else if (n === hover) { ctx.lineWidth = 1.5; ctx.strokeStyle = text; ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  // Titles in a second pass so no node is ever drawn over a title.
  for (const n of nodes) {
    if (!visible(n) || !wantsLabel(n, focus) || !(lit(n) || matches(n))) continue;
    const [x, y] = toScreen(n.x, n.y), r = R(n) * Math.max(0.5, Math.min(view.k, 2.2));
    if (x < -60 || y < -60 || x > W + 60 || y > H + 60) continue;
    ctx.font = `${n === focus ? 600 : MAIN.has(n.kind) ? 550 : 450} ${fs}px system-ui, sans-serif`;
    const t = n.label.length > 42 ? n.label.slice(0, 40) + "…" : n.label;
    ctx.fillStyle = n === focus ? text : label;
    ctx.fillText(t, x, y + r + 4);
  }
}

// --- interaction ---------------------------------------------------------
function nodeAt(sx, sy) {
  const [wx, wy] = toWorld(sx, sy); let best = null, bd = Infinity;
  for (const n of nodes) {
    if (!visible(n)) continue;
    const d = Math.hypot(n.x - wx, n.y - wy), hit = (R(n) * Math.max(0.5, Math.min(view.k, 2.2))) / view.k + 4 / view.k;
    if (d < hit && d < bd) { best = n; bd = d; }
  }
  return best;
}
canvas.addEventListener("pointerdown", (ev) => {
  canvas.setPointerCapture(ev.pointerId); moved = false;
  const n = nodeAt(ev.offsetX, ev.offsetY);
  if (n) { dragNode = n; heat(0.3); } else panning = { x: ev.offsetX, y: ev.offsetY, vx: view.x, vy: view.y };
  canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", (ev) => {
  if (dragNode) { const [wx, wy] = toWorld(ev.offsetX, ev.offsetY); dragNode.x = wx; dragNode.y = wy; moved = true; if (S.frozen) draw(); return; }
  if (panning) {
    view.x = panning.vx - (ev.offsetX - panning.x) / view.k; view.y = panning.vy - (ev.offsetY - panning.y) / view.k;
    moved = moved || Math.abs(ev.offsetX - panning.x) + Math.abs(ev.offsetY - panning.y) > 3; draw(); return;
  }
  const h = nodeAt(ev.offsetX, ev.offsetY);
  if (h !== hover) { hover = h; canvas.style.cursor = h ? "pointer" : "grab"; draw(); }
});
canvas.addEventListener("pointerup", (ev) => {
  canvas.classList.remove("dragging");
  const n = nodeAt(ev.offsetX, ev.offsetY);
  if (!moved) select(n);
  dragNode = null; panning = null;
});
canvas.addEventListener("dblclick", (ev) => { const n = nodeAt(ev.offsetX, ev.offsetY); if (n) focusOn(n, 2); });
canvas.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const [wx, wy] = toWorld(ev.offsetX, ev.offsetY);
  view.k = Math.min(6, Math.max(0.1, view.k * Math.exp(-ev.deltaY * 0.0015)));
  view.x = wx - (ev.offsetX - W / 2) / view.k; view.y = wy - (ev.offsetY - H / 2) / view.k; draw();
}, { passive: false });

function focusOn(n, k) {
  const from = { ...view }, to = { x: n.x, y: n.y, k: k ?? Math.max(view.k, 1.4) }, t0 = performance.now();
  (function step(t) {
    const p = Math.min(1, (t - t0) / 350), e = 1 - Math.pow(1 - p, 3);
    view.x = from.x + (to.x - from.x) * e; view.y = from.y + (to.y - from.y) * e; view.k = from.k + (to.k - from.k) * e;
    draw(); if (p < 1) requestAnimationFrame(step);
  })(t0);
}
function fit() {
  const vis = nodes.filter(visible); if (!vis.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of vis) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); }
  view.x = (x0 + x1) / 2; view.y = (y0 + y1) / 2;
  view.k = Math.min(2, Math.max(0.15, Math.min((W - 100) / (x1 - x0 + 1), (H - 100) / (y1 - y0 + 1))));
  draw();
}

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function select(n) {
  selected = n; computeLocal(); draw();
  if (S.depth) heat(0.4);
  const panel = document.getElementById("panel");
  if (!n) { panel.classList.remove("open"); return; }
  const color = KINDS[n.kind]?.color ?? "#999";
  let h = `<div class="pk"><span class="dot" style="background:${color}"></span> ${esc(kindLabel(n.kind))}</div><h2>${esc(n.label)}</h2>`;
  if (n.summary) h += `<div class="summary">${esc(n.summary)}</div>`;
  if (n.path) {
    h += `<div class="actions"><a class="btn" href="obsidian://open?path=${encodeURIComponent(n.path)}">${T.obs}</a>`
       + `<a class="btn" href="file://${encodeURI(n.path)}">${T.file}</a></div>`;
  }
  if (n.items.length) {
    h += `<h3>${T.knows}</h3><ul>` + n.items.map((it) =>
      `<li>${ICON[it.kind] ?? "•"} ${esc(it.text || (it.list ? it.list.length + " " + T.elems : ""))}${it.list ? `<ol class="sub">${it.list.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}<div class="meta">${esc([it.date && (it.kind === "task" || it.kind === "deadline" ? T.due + " " + it.date : it.date), it.src].filter(Boolean).join(" · "))}</div></li>`).join("") + `</ul>`;
  }
  const nbs = [...n.nb].sort((a, b) => b.deg - a.deg);
  if (nbs.length) {
    h += `<h3>${T.connected} (${nbs.length})</h3><ul>` + nbs.map((m) =>
      `<li class="nb" data-id="${esc(m.id)}"><span class="dot" style="background:${KINDS[m.kind]?.color ?? "#999"}"></span><span>${esc(m.label)}`
      + (whyOf.get(n.id + "|" + m.id) ? `<div class="meta">${esc(whyOf.get(n.id + "|" + m.id))}</div>` : "") + `</span></li>`).join("") + `</ul>`;
  }
  document.getElementById("detail").innerHTML = h;
  document.querySelectorAll("#detail .nb").forEach((el) => el.addEventListener("click", () => { const m = byId.get(el.dataset.id); reveal(m); select(m); focusOn(m); }));
  panel.classList.add("open");
}
document.getElementById("close").onclick = () => select(null);
// Make a node visible even if its type is currently hidden (search/neighbour jump).
function reveal(n) { if (hidden.has(n.kind)) { hidden.delete(n.kind); renderTypes(); changed(true); } }

// --- centered search palette ----------------------------------------------
const palette = document.getElementById("palette"), pinput = document.getElementById("pinput"), presults = document.getElementById("presults");
let hits = [], cursor = 0;
pinput.placeholder = T.searchPh;
function openSearch() { palette.classList.add("open"); pinput.value = query; renderResults(); setTimeout(() => pinput.focus(), 0); }
function closeSearch(keepQuery = false) { palette.classList.remove("open"); if (!keepQuery) { query = ""; draw(); } }
function renderResults() {
  query = pinput.value.trim().toLowerCase();
  hits = query ? nodes.filter((n) => n.label.toLowerCase().includes(query)).sort((a, b) =>
    (a.label.toLowerCase().startsWith(query) ? 0 : 1) - (b.label.toLowerCase().startsWith(query) ? 0 : 1) || b.deg - a.deg).slice(0, 9) : [];
  cursor = Math.min(cursor, Math.max(0, hits.length - 1));
  presults.innerHTML = !query ? "" : hits.length
    ? hits.map((n, i) => `<div class="res${i === cursor ? " on" : ""}" data-i="${i}"><span class="dot" style="background:${KINDS[n.kind]?.color ?? "#999"}"></span>${esc(n.label)}<span class="k">${esc(kindLabel(n.kind))}</span></div>`).join("")
    : `<div class="none">${T.noResult}</div>`;
  presults.querySelectorAll(".res").forEach((el) => el.addEventListener("click", () => choose(hits[Number(el.dataset.i)])));
  draw();
}
function choose(n) { if (!n) return; closeSearch(); reveal(n); select(n); focusOn(n, 1.8); }
pinput.addEventListener("input", () => { cursor = 0; renderResults(); });
pinput.addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown") { ev.preventDefault(); cursor = Math.min(cursor + 1, hits.length - 1); renderResults(); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); cursor = Math.max(cursor - 1, 0); renderResults(); }
  else if (ev.key === "Enter") { ev.preventDefault(); choose(hits[cursor]); }
  else if (ev.key === "Escape") { ev.preventDefault(); closeSearch(); }
});
palette.addEventListener("pointerdown", (ev) => { if (ev.target === palette) closeSearch(); });
document.getElementById("openSearch").onclick = openSearch;
document.getElementById("searchLabel").textContent = T.search;

// --- sidebar: types -------------------------------------------------------
const typesEl = document.getElementById("types");
const counts = {}; nodes.forEach((n) => (counts[n.kind] = (counts[n.kind] || 0) + 1));
document.getElementById("typesTitle").textContent = T.types;
function renderTypes() {
  typesEl.innerHTML = "";
  for (const [kind, k] of Object.entries(KINDS)) {
    if (!counts[kind]) continue;
    const b = document.createElement("button"); b.className = "kind" + (hidden.has(kind) ? " off" : "");
    b.innerHTML = `<span class="dot" style="background:${k.color}"></span>${kindLabel(kind)}<span class="n">${counts[kind]}</span>`;
    b.onclick = () => {
      hidden.has(kind) ? hidden.delete(kind) : hidden.add(kind); b.classList.toggle("off");
      if (selected && !visible(selected)) select(null);
      changed();
    };
    typesEl.appendChild(b);
  }
}

// --- sidebar: settings ----------------------------------------------------
const settingsEl = document.getElementById("settings");
document.getElementById("settingsTitle").textContent = T.display;
function seg(key, options) {
  return `<div class="seg" data-key="${key}">` + options.map(([v, l]) => `<button data-v="${v}" class="${String(S[key]) === String(v) ? "on" : ""}">${l}</button>`).join("") + `</div>`;
}
function renderSettings() {
  const edgeRgb = css("--edge"), connRgb = css("--conn");
  settingsEl.innerHTML = `
    <div class="sub">${T.labels}</div>${seg("labels", [["hubs", T.lHubs], ["auto", T.lAuto], ["all", T.lAll], ["none", T.lNone]])}
    <div class="sub">${T.linkTypes}</div>
    <label class="row"><span><span class="swatch" style="border-color:rgba(${edgeRgb},.6)"></span>${T.tree}</span><input type="checkbox" data-k="tree" ${S.tree ? "checked" : ""}></label>
    <label class="row"><span><span class="swatch" style="border-color:rgba(${connRgb},.9)"></span>${T.conn}</span><input type="checkbox" data-k="conn" ${S.conn ? "checked" : ""}></label>
    <label class="row"><span><span class="swatch" style="border-color:rgba(${edgeRgb},.5);border-top-style:dashed"></span>${T.weak}</span><input type="checkbox" data-k="weak" ${S.weak ? "checked" : ""}></label>
    <div class="sub">${T.view}</div>
    <label class="row">${T.nodeSize}<input type="range" min="0.5" max="1.8" step="0.1" data-r="nodeScale" value="${S.nodeScale}"></label>
    <label class="row">${T.textSize}<input type="range" min="0.7" max="1.6" step="0.1" data-r="textScale" value="${S.textScale}"></label>
    <label class="row">${T.orphans}<input type="checkbox" data-k="orphans" ${S.orphans ? "checked" : ""}></label>
    <div class="sub">${T.local}</div>
    ${seg("depth", [[0, T.off], [1, "1"], [2, "2"], [3, "3"]])}
    <div class="btns" style="margin-top:12px">
      <button class="btn" id="freeze">${S.frozen ? T.resume : T.freeze}</button>
      <button class="btn" id="fitBtn">${T.fit}</button>
      <button class="btn" id="resetBtn">${T.reset}</button>
    </div>`;
  settingsEl.querySelectorAll(".seg").forEach((sg) => sg.querySelectorAll("button").forEach((b) => (b.onclick = () => {
    const key = sg.dataset.key;
    S[key] = key === "depth" ? Number(b.dataset.v) : b.dataset.v;
    renderSettings(); changed(key === "depth");
  })));
  settingsEl.querySelectorAll("input[data-k]").forEach((i) => (i.onchange = () => { S[i.dataset.k] = i.checked; changed(true); }));
  settingsEl.querySelectorAll("input[data-r]").forEach((i) => (i.oninput = () => { S[i.dataset.r] = Number(i.value); changed(i.dataset.r === "nodeScale"); }));
  document.getElementById("freeze").onclick = () => { S.frozen = !S.frozen; renderSettings(); save(); if (!S.frozen) heat(0.3); };
  document.getElementById("fitBtn").onclick = fit;
  document.getElementById("resetBtn").onclick = () => {
    const collapsed = S.collapsed;
    S = { ...DEFAULTS, collapsed }; hidden.clear(); defaultHidden().forEach((k) => hidden.add(k));
    renderTypes(); renderSettings(); changed(true); fit();
  };
}
function changed(relayout = true) {
  recomputeDegrees(); computeLocal(); save();
  if (relayout) heat(0.5); else draw();
}

// --- sidebar collapse ----------------------------------------------------------
function applyCollapsed() {
  document.body.classList.toggle("collapsed", S.collapsed);
  resize();
}
document.getElementById("collapse").title = T.collapse;
document.getElementById("collapse").onclick = () => { S.collapsed = true; save(); applyCollapsed(); };
document.getElementById("expand").onclick = () => {
  if (innerWidth <= 700) { document.body.classList.toggle("mobile-open"); return; }
  S.collapsed = false; save(); applyCollapsed();
};

addEventListener("keydown", (ev) => {
  if (palette.classList.contains("open")) return;
  if (ev.target.tagName === "INPUT") return;
  if (ev.key === "Enter" || (ev.key === "k" && (ev.ctrlKey || ev.metaKey)) || ev.key === "/") { ev.preventDefault(); openSearch(); }
  else if (ev.key === "Escape") { select(null); query = ""; draw(); }
  else if (ev.key === "l" || ev.key === "L") {
    const order = ["hubs", "auto", "all", "none"]; S.labels = order[(order.indexOf(S.labels) + 1) % 4];
    renderSettings(); changed(false);
  }
  else if (ev.key === "f" || ev.key === "F") fit();
  else if (ev.key === "[") { S.collapsed = !S.collapsed; save(); applyCollapsed(); }
  else if (ev.key === " ") { ev.preventDefault(); S.frozen = !S.frozen; renderSettings(); save(); if (!S.frozen) heat(0.3); }
});

document.getElementById("stats").textContent = `${nodes.length} ${T.nodes} · ${edges.length} ${T.links}`;
document.getElementById("stats").title = DATA.generated;
document.getElementById("hint").innerHTML = T.hint;
document.getElementById("emptyTitle").textContent = T.emptyT;
document.getElementById("emptyText").innerHTML = T.emptyP;
if (!nodes.length) document.getElementById("empty").style.display = "grid";

addEventListener("resize", resize);
recomputeDegrees();
renderTypes();
renderSettings();
document.body.classList.toggle("collapsed", S.collapsed);
resize();
for (let i = 0; i < 300; i++) tick(); // pre-settle so the first frame is calm
alpha = 0.3; fit(); looping = true; requestAnimationFrame(loop);
</script>
</body>
</html>
